modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

[[mods]]
modId="aurora_vicky"
version="1.0.5"
displayName="Aurora Vicky"
authors="Aurora Studios"
description='''
Modelo e textura do Caldeirao Futuro para a brewing stand.
Troca as particulas do Totem of Possession (Alex's Caves) pelo sprite personalizado.
Pronomes: /pronome <texto> mostra um segundo nome menor abaixo da name tag.
Texturas de interface (inventario e botoes) do Aurora Mortis.
'''
displayTest="IGNORE_SERVER_VERSION"

# FML only loads mixin configs declared here. Without these entries the JSON
# files exist in the jar but are silently ignored, so the pronoun name tag and
# the totem particle swap never run.
[[mixins]]
config="aurorapronouns.mixins.json"

[[mixins]]
config="auroratotem.mixins.json"

[[dependencies.aurora_vicky]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.aurora_vicky]]
    modId="alexscaves"
    mandatory=true
    versionRange="[2.0.2,)"
    ordering="AFTER"
    side="CLIENT"
