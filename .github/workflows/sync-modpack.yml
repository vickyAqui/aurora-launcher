name: Sync modpack release

on:
  push:
    branches:
      - main
    paths:
      - 'modpack.json'
      - 'release-assets/**'
      - '.github/workflows/sync-modpack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: node -e "const m=require('./modpack.json'); if(!Array.isArray(m.files)||m.files.length===0) process.exit(1); console.log('Manifest OK:',m.files.length,'entries')"

      - name: Upload missing assets and the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          node -e "const m=require('./modpack.json'); for (const f of m.files) if (f.type !== 'FOLDER') console.log(decodeURIComponent(f.url.split('/').pop())+'\t'+'release-assets/'+decodeURIComponent(f.url.split('/').pop()))" > "$RUNNER_TEMP/assets.tsv"
          cut -f1 "$RUNNER_TEMP/assets.tsv" | sort -u > "$RUNNER_TEMP/expected.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/tags/modpack" --jq '.assets[].name' | sort -u > "$RUNNER_TEMP/current.txt"
          comm -23 "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/current.txt" > "$RUNNER_TEMP/missing.txt"

          while IFS=$'\t' read -r asset file; do
            if grep -Fxq "$asset" "$RUNNER_TEMP/missing.txt" && [ -f "$file" ]; then
              echo "Uploading missing asset: $asset"
              gh release upload modpack "$file#$asset" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done < "$RUNNER_TEMP/assets.tsv"

          gh release upload modpack modpack.json --repo "$GITHUB_REPOSITORY" --clobber
